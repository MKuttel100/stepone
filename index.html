<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step One Group — Cotizador</title>
<style>
  :root{
    --blue:#2D86C3;
    --blue-dark:#1B4F73;
    --navy:#0F2E44;
    --gray-bg:#F4F6F8;
    --border:#DDE3E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--gray-bg);
    color:#1a2530;
    display:flex;
    justify-content:center;
    padding:60px 16px;
  }
  .wrap{width:100%; max-width:640px;}
  .brand{text-align:center; margin-bottom:40px;}
  .brand h1{color:var(--navy); font-size:22px; margin:0 0 4px;}
  .brand p{color:#5b6b78; font-size:14px; margin:0;}
  .card{
    display:block;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px 24px;
    margin-bottom:14px;
    text-decoration:none;
    color:inherit;
    transition:box-shadow .15s, border-color .15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(15,46,68,0.10); border-color:var(--blue);}
  .card h2{font-size:16px; color:var(--blue-dark); margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .card p{font-size:13px; color:#5b6b78; margin:0;}
  .state{text-align:center; color:#5b6b78; font-size:14px; padding:20px 0;}
  .foot{text-align:center; margin-top:30px; font-size:12px; color:#8FAFC4;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>Step One Group</h1>
      <p>Cotizador — elegí el tipo de cotización</p>
    </div>

    <div id="cards">
      <div class="state">Cargando plantillas…</div>
    </div>

    <div class="foot">+54 9 11 5626-9027 · martin@steponegroup.com.ar</div>
  </div>

<script>
  const REPO = 'MKuttel100/stepone';

  const ICONS = [
    { match: /aereo/i, icon: '✈️' },
    { match: /hotel/i, icon: '🏨' },
    { match: /paquete/i, icon: '🧳' },
    { match: /voucher/i, icon: '🎫' },
  ];

  const DESCRIPTIONS = [
    { match: /aereo/i, text: 'Itinerario, tarifas por pasajero y equipaje.' },
    { match: /hotel/i, text: 'Alojamiento, habitaciones y régimen.' },
    { match: /paquete/i, text: 'Aéreo + hotel + excursiones + traslados + asistencia.' },
    { match: /voucher/i, text: 'Voucher para entregar al pasajero.' },
  ];

  const TITLES = [
    { match: /aereo/i, text: 'Aéreos' },
    { match: /hotel/i, text: 'Hotelería' },
    { match: /paquete/i, text: 'Paquete turístico' },
    { match: /voucher/i, text: 'Voucher' },
  ];

  function guessIcon(name){
    const found = ICONS.find(i => i.match.test(name));
    return found ? found.icon : '📄';
  }

  function guessDescription(name){
    const found = DESCRIPTIONS.find(d => d.match.test(name));
    return found ? found.text : 'Plantilla de cotización.';
  }

  function guessTitle(name){
    const found = TITLES.find(t => t.match.test(name));
    return found ? found.text : prettyName(name);
  }

  function prettyName(filename){
    let n = filename.replace(/\.html?$/i, '');
    n = n.replace(/\(\d+\)/g, '');       // saca (2), (3), etc.
    n = n.replace(/[_\-]+/g, ' ').trim();
    n = n.replace(/\s+/g, ' ');
    return n.charAt(0).toUpperCase() + n.slice(1);
  }

  async function loadFiles(){
    const container = document.getElementById('cards');
    try{
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/`);
      if(!res.ok) throw new Error('No se pudo leer el repositorio');
      const data = await res.json();

      const files = data
        .filter(f => f.type === 'file' && /\.html?$/i.test(f.name) && f.name.toLowerCase() !== 'index.html')
        .sort((a, b) => a.name.localeCompare(b.name));

      if(files.length === 0){
        container.innerHTML = '<div class="state">Todavía no hay plantillas subidas.</div>';
        return;
      }

      container.innerHTML = files.map(f => `
        <a class="card" href="${encodeURIComponent(f.name)}">
          <h2>${guessIcon(f.name)} ${guessTitle(f.name)}</h2>
          <p>${guessDescription(f.name)}</p>
        </a>
      `).join('');
    }catch(err){
      container.innerHTML = '<div class="state">No se pudieron cargar las plantillas. Revisá tu conexión e intentá de nuevo.</div>';
    }
  }

  loadFiles();
</script>
</body>
</html>
