<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step One Group — Cotizador</title>
<style>
  :root{
    --blue:#2D86C3;
    --blue-dark:#1B4F73;
    --navy:#0F2E44;
    --gray-bg:#F4F6F8;
    --border:#DDE3E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--gray-bg);
    color:#1a2530;
    display:flex;
    justify-content:center;
    padding:60px 16px;
  }
  .wrap{width:100%; max-width:640px;}
  .brand{text-align:center; margin-bottom:40px;}
  .brand h1{color:var(--navy); font-size:22px; margin:0 0 4px;}
  .brand p{color:#5b6b78; font-size:14px; margin:0;}
  .card{
    display:block;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px 24px;
    margin-bottom:14px;
    text-decoration:none;
    color:inherit;
    transition:box-shadow .15s, border-color .15s;
  }
  .card:hover{box-shadow:0 4px 14px rgba(15,46,68,0.10); border-color:var(--blue);}
  .card h2{font-size:16px; color:var(--blue-dark); margin:0 0 4px;}
  .card p{font-size:13px; color:#5b6b78; margin:0;}
  .foot{text-align:center; margin-top:30px; font-size:12px; color:#8FAFC4;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>Step One Group</h1>
      <p>Cotizador — elegí el tipo de cotización</p>
    </div>

    <a class="card" href="cotizacion_aereos.html">
      <h2>✈️ Aéreos</h2>
      <p>Itinerario, tarifas por pasajero y equipaje.</p>
    </a>

    <a class="card" href="cotizacion_hoteleria.html">
      <h2>🏨 Hotelería</h2>
      <p>Alojamiento, habitaciones y régimen.</p>
    </a>

    <a class="card" href="cotizacion_paquete.html">
      <h2>🧳 Paquete turístico</h2>
      <p>Aéreo + hotel + excursiones + traslados + asistencia.</p>
    </a>

    <div class="foot">+54 9 11 5626-9027 · martin@steponegroup.com.ar</div>
  </div>
</body>
</html>
