<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cotización Aérea — Step One Group</title>
<style>
  :root{
    --blue:#2D86C3;
    --blue-dark:#1B4F73;
    --navy:#0F2E44;
    --ink:#1a2530;
    --muted:#5b6b78;
    --gray-bg:#F4F6F8;
    --border:#DDE3E8;
    --paper:#FFFFFF;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:var(--gray-bg);
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .app{
    display:flex;
    justify-content:center;
    padding:28px 16px 80px;
  }
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:800px;
    box-shadow:0 4px 24px rgba(15,46,68,0.12);
    border-radius:6px;
    overflow:hidden;
  }
  .toolbar{
    max-width:800px;
    margin:0 auto 14px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .btn{
    border:none;
    border-radius:5px;
    padding:10px 18px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--gray-bg);}
  .btn-add{
    background:transparent;
    color:var(--blue);
    border:1px dashed var(--blue);
    padding:6px 12px;
    font-size:12.5px;
    border-radius:5px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
  }
  .btn-remove{
    background:transparent;
    border:none;
    color:var(--danger);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:4px 6px;
  }

  /* ---- header ---- */
  .head{
    background:var(--navy);
    color:#fff;
    padding:14px 34px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }
  .head-left{display:flex; gap:16px; align-items:center;}
  .head-left img{height:46px; display:block; background:#fff; border-radius:6px; padding:4px 8px;}
  .agency-info{font-size:12px; line-height:1.6; color:#CFE0EC;}
  .agency-info strong{display:block; font-size:15px; color:#fff; margin-bottom:2px; letter-spacing:.3px;}
  .head-right{text-align:right;}
  .doc-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--blue);
    font-weight:700;
    margin-bottom:8px;
  }
  .doc-meta{font-size:12px; color:#CFE0EC; display:flex; flex-direction:column; gap:4px; align-items:flex-end;}
  .doc-meta .row{display:flex; align-items:center; gap:6px;}
  .doc-meta label{color:#8FAFC4;}
  .doc-meta input, .doc-meta select{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:4px;
    padding:4px 6px;
    font-size:12px;
    font-family:inherit;
    text-align:right;
  }
  .doc-meta input::placeholder{color:#8FAFC4;}

  /* ---- sections ---- */
  .section{padding:10px 34px; border-bottom:1px solid var(--border);}
  .section:last-of-type{border-bottom:none;}
  .section h2{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--blue-dark);
    margin:0 0 14px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section h2::before{
    content:"";
    width:4px; height:14px;
    background:var(--blue);
    border-radius:2px;
    display:inline-block;
  }
  .flight-option > h2{justify-content:space-between;}
  .flight-option > h2::before{content:none;}
  .flight-option > h2 .h2-label{display:flex; align-items:center; gap:8px;}
  .flight-option > h2 .h2-label::before{content:""; width:4px; height:14px; background:var(--blue); border-radius:2px; display:inline-block;}
  .opt-title-input{
    border:1px solid var(--border);
    border-radius:4px;
    padding:3px 8px;
    font-size:11.5px;
    font-weight:700;
    color:var(--blue-dark);
    text-transform:uppercase;
    letter-spacing:.5px;
    width:190px;
    font-family:inherit;
    background:#fff;
  }
  .field-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px 18px;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field.span2{grid-column:span 2;}
  .field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:600;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border);
    border-radius:4px;
    padding:7px 9px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue); outline-offset:0;}

  /* ---- table ---- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    padding:6px 8px;
    border-bottom:2px solid var(--border);
    font-weight:700;
  }
  tbody td{padding:3px 6px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:1px solid var(--border);}
  td input, td select{
    border:1px solid transparent;
    background:transparent;
    width:100%;
    padding:6px 6px;
    font-size:13px;
    font-family:inherit;
    border-radius:4px;
  }
  td input.airport-cell{font-size:11px; padding:6px 2px;}
  td input:hover, td select:hover{border-color:var(--border);}
  td input:focus, td select:focus{outline:none; border-color:var(--blue); background:#F7FBFE;}
  td.num input{text-align:right;}
  .col-remove{width:34px; text-align:center;}
  .col-total{text-align:right; font-weight:600; white-space:nowrap;}

  .table-actions{margin-top:10px;}

  .totals{
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }
  .totals-box{
    min-width:260px;
    background:var(--gray-bg);
    border-radius:6px;
    padding:14px 18px;
  }
  .totals-row{display:flex; justify-content:space-between; gap:14px; font-size:14px; color:var(--muted); padding:3px 0;}
  .totals-row.grand{
    border-top:1px solid var(--border);
    margin-top:6px;
    padding-top:10px;
    font-size:19px;
    font-weight:700;
    color:var(--navy);
  }

  .conditions textarea{min-height:60px; resize:none; overflow:hidden; font-size:11px; line-height:1.4; color:var(--muted); width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:4px; padding:10px 12px; font-family:inherit;}

  .foot{
    background:var(--gray-bg);
    padding:6px 34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    color:var(--muted);
  }
  .foot strong{color:var(--navy);}

  .no-print{}
  @media print{
    input::placeholder, textarea::placeholder{ color:transparent !important; }
    body{background:#fff;}
    .app{padding:0;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; border-radius:0; max-width:100%;}
    .no-print{display:none !important;}
    td input, td select, .field input, .field select, .doc-meta input, .doc-meta select, .conditions textarea, .opt-title-input{border-color:transparent !important; background:transparent !important; padding-left:0 !important; padding-right:0 !important;}
    .field input, .field select{padding-left:0;}
    .print-hide-empty{ display:none !important; }
    @page{ size:A4; margin:10mm 12mm; }
  }
</style>
</head>

<script>
  function toggleEquipajeOtro(select){
    const otro = select.closest('.field').querySelector('[data-role="equipajeOtro"]');
    otro.style.display = select.value === '__otro__' ? 'block' : 'none';
    if(select.value !== '__otro__') otro.value = '';
  }

  let flightOptCount = 0;

  function addFlightOption(data){
    flightOptCount++;
    const id = flightOptCount;
    const d = data || {};
    const div = document.createElement('div');
    div.className = 'section flight-option';
    div.id = 'flightOpt' + id;
    div.innerHTML = `
      <h2>
        <span class="h2-label" style="display:flex; align-items:center; gap:6px; flex:1;">
          <span style="white-space:nowrap;">Detalle del vuelo —</span>
          <input type="text" class="opt-title-input" data-role="optTitle" placeholder="Opción A" value="${d.optTitle||''}" oninput="syncOptTitle(${id})">
        </span>
        <button class="btn-remove no-print" onclick="removeFlightOption(${id})" title="Quitar esta opción">×</button>
      </h2>
      <div class="field-grid">
        <div class="field">
          <label>Aerolínea</label>
          <input type="text" list="airlineList" placeholder="Código IATA, ej: AR" data-role="aerolinea" oninput="autoAirline(this)" onblur="autoAirline(this,true)" style="text-transform:uppercase;" value="${d.aerolinea||''}">
        </div>
        <div class="field">
          <label>Clase</label>
          <select data-role="clase">
            <option value="">Seleccionar</option>
            <option${d.clase==='Económica'?' selected':''}>Económica</option>
            <option${d.clase==='Premium Economy'?' selected':''}>Premium Economy</option>
            <option${d.clase==='Ejecutiva'?' selected':''}>Ejecutiva</option>
            <option${d.clase==='Primera'?' selected':''}>Primera</option>
          </select>
        </div>
        <div class="field">
          <label>Equipaje incluido</label>
          <select data-role="equipaje" onchange="toggleEquipajeOtro(this)">
            <option value="">Seleccionar</option>
            <option value="1 valija de despacho">1 valija de despacho</option>
            <option value="1 carry on en cabina">1 carry on en cabina</option>
            <option value="1 bolso de mano">1 bolso de mano</option>
            <option value="1 valija de despacho + carry on en cabina">1 valija de despacho + carry on en cabina</option>
            <option value="2 valijas de despacho + carry on en cabina">2 valijas de despacho + carry on en cabina</option>
            <option value="__otro__">Otro (especificar)</option>
          </select>
          <input type="text" data-role="equipajeOtro" placeholder="Especificar equipaje" style="display:none; margin-top:6px;">
        </div>
      </div>

      <div style="margin-top:18px;">
        <table>
          <thead>
            <tr>
              <th style="width:7%">Vuelo</th>
              <th style="width:10%">Fecha</th>
              <th style="width:28%">Origen</th>
              <th style="width:28%">Destino</th>
              <th style="width:8%">Salida</th>
              <th style="width:8%">Llegada</th>
              <th style="width:7%">+1 día</th>
              <th class="col-remove no-print"></th>
            </tr>
          </thead>
          <tbody data-role="itinBody"></tbody>
        </table>
        <div class="table-actions no-print">
          <button class="btn-add" onclick="addItinRow(${id})">+ Agregar tramo</button>
        </div>
      </div>

      <div style="margin-top:22px; border-top:1px solid var(--border); padding-top:18px;">
        <h2 style="margin-bottom:14px;">Tarifas — <span class="opt-letter-fares"></span></h2>
        <table>
          <thead>
            <tr>
              <th style="width:26%">Pasajero</th>
              <th style="width:14%">Tipo</th>
              <th style="width:18%">Tarifa</th>
              <th style="width:18%">Tasas / Imp.</th>
              <th style="width:18%" class="col-total">Total</th>
              <th class="col-remove no-print"></th>
            </tr>
          </thead>
          <tbody data-role="faresBody"></tbody>
        </table>
        <div class="table-actions no-print">
          <button class="btn-add" onclick="addFareRow(${id})">+ Agregar pasajero</button>
        </div>

        <div class="totals">
          <div class="totals-box">
            <div class="totals-row"><span>Subtotal tarifas</span><span data-role="sumFares">0,00</span></div>
            <div class="totals-row"><span>Subtotal tasas</span><span data-role="sumTaxes">0,00</span></div>
            <div class="totals-row grand"><span data-role="optFareLabel">Total Opción</span><span data-role="optFareTotal">USD 0,00</span></div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('flightOptionsContainer').appendChild(div);
    if(d.aerolinea) document.querySelector('#flightOpt'+id+' [data-role="clase"]').value = d.clase || '';
    if(d.equipaje){
      const eqSel = document.querySelector('#flightOpt'+id+' [data-role="equipaje"]');
      eqSel.value = d.equipaje;
      toggleEquipajeOtro(eqSel);
    }
    renderFlightLabels();
    return id;
  }

  function removeFlightOption(id){
    const el = document.getElementById('flightOpt' + id);
    if(el) el.remove();
    renderFlightLabels();
  }

  function renderFlightLabels(){
    const opts = document.querySelectorAll('.flight-option');
    const letters = 'ABCDEFGHIJ';
    opts.forEach((opt, idx) => {
      const label = letters[idx] || (idx + 1);
      const titleInput = opt.querySelector('[data-role="optTitle"]');
      if(!titleInput.value.trim()){
        titleInput.value = 'Opción ' + label;
      }
      syncOptTitle(opt.id.replace('flightOpt',''));
    });
    document.querySelectorAll('.flight-option .btn-remove').forEach(btn => {
      btn.style.display = opts.length > 1 ? '' : 'none';
    });
    render();
  }

  function syncOptTitle(id){
    const opt = document.getElementById('flightOpt' + id);
    const titleInput = opt.querySelector('[data-role="optTitle"]');
    const val = titleInput.value.trim() || 'Opción';
    const letterSpan = opt.querySelector('.opt-letter-fares');
    if(letterSpan) letterSpan.textContent = val;
    const optFareLabel = opt.querySelector('[data-role="optFareLabel"]');
    if(optFareLabel) optFareLabel.textContent = 'Total ' + val;
  }

  function autoResizeConditions(){
    const ta = document.getElementById('conditions');
    if(!ta) return;
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }

  function todayLocal(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  (function(){
    const dl = document.getElementById('airlineList');
    Object.keys(AIRLINES).sort().forEach(code=>{
      const a = AIRLINES[code];
      const opt = document.createElement('option');
      opt.value = code + ' - ' + a.nombre;
      dl.appendChild(opt);
    });
  })();

  function autoAirline(input, isBlur){
    const raw = input.value.trim();
    if(!raw) return;
    const codeMatch = raw.toUpperCase().match(/^([A-Z0-9]{2})\b/);
    if(!codeMatch) return;
    const code = codeMatch[1];
    const info = AIRLINES[code];
    if(!info) return;
    const formatted = code + ' - ' + info.nombre;

    }
  }

{"ciudad":"Manaos","pais":"Brasil"},"NAT":{"ciudad":"Natal","pais":"Brasil"},"POA":{"ciudad":"Porto Alegre","pais":"Brasil"},"REC":{"ciudad":"Recife","pais":"Brasil"},"GIG":{"ciudad":"Río de Janeiro","pais":"Brasil"},"SDU":{"ciudad":"Río de Janeiro","pais":"Brasil"},"SSA":{"ciudad":"Salvador de Bahía","pais":"Brasil"},"GRU":{"ciudad":"São Paulo","pais":"Brasil"},"CGH":{"ciudad":"São Paulo","pais":"Brasil"},"SCL":{"ciudad":"Santiago","pais":"Chile"},"BOG":{"ciudad":"Bogotá","pais":"Colombia"},"CTG":{"ciudad":"Cartagena","pais":"Colombia"},"MDE":{"ciudad":"Medellín","pais":"Colombia"},"GYE":{"ciudad":"Guayaquil","pais":"Ecuador"},"UIO":{"ciudad":"Quito","pais":"Ecuador"},"ASU":{"ciudad":"Asunción","pais":"Paraguay"},"CUZ":{"ciudad":"Cusco","pais":"Perú"},"LIM":{"ciudad":"Lima","pais":"Perú"},"MVD":{"ciudad":"Montevideo","pais":"Uruguay"},"CCS":{"ciudad":"Caracas","pais":"Venezuela"},"CAI":{"ciudad":"El Cairo","pais":"Egipto"},"ADD":{"ciudad":"Addis Abeba","pais":"Etiopía"},"NBO":{"ciudad":"Nairobi","pais":"Kenia"},"CMN":{"ciudad":"Casablanca","pais":"Marruecos"},"LOS":{"ciudad":"Lagos","pais":"Nigeria"},"CPT":{"ciudad":"Ciudad del Cabo","pais":"Sudáfrica"},"JNB":{"ciudad":"Johannesburgo","pais":"Sudáfrica"}};

  // build datalist options once
  (function(){
    const dl = document.getElementById('airportList');
    Object.keys(AIRPORTS).sort().forEach(code=>{
      const a = AIRPORTS[code];
      const opt = document.createElement('option');
      opt.value = code + ' - ' + a.ciudad + ', ' + a.pais;
      dl.appendChild(opt);
    });
  })();

  function toggleVia(input){
    const wrap = input.closest('.via-wrap');
    if(!wrap) return;
    wrap.classList.toggle('print-hide-empty', !input.value.trim());
  }

  function autoAirport(input, isBlur){
    const raw = input.value.trim();
    if(!raw) return;
    // if already formatted ("CODE - Ciudad, País") leave as is unless code changed
    const codeMatch = raw.toUpperCase().match(/^([A-Z]{3})\b/);
    if(!codeMatch) return;
    const code = codeMatch[1];
    const info = AIRPORTS[code];
    if(!info) return;
    const formatted = code + ' - ' + info.ciudad + ', ' + info.pais;
    // auto-complete once user typed exactly the 3-letter code (input event),
    // or on blur, always normalize to the full formatted text
    if(isBlur || raw.toUpperCase() === code){
      input.value = formatted;
    }
  }

  let itinCount = 0;

  function addItinRow(optId, data){
    itinCount++;
    const id = itinCount;
    const tr = document.createElement('tr');
    tr.id = 'itinRow'+id;
    const d = data || {};
    tr.innerHTML = `
      <td><input type="text" placeholder="DL 110" data-role="vuelo" value="${d.vuelo||''}"></td>
      <td><input type="date" data-role="fecha" onchange="autoNextDay(${id})" value="${d.fecha||''}"></td>
      <td><input type="text" class="airport-cell" list="airportList" placeholder="Código IATA" data-role="origen" oninput="autoAirport(this)" onblur="autoAirport(this,true)" style="text-transform:uppercase;" value="${d.origen||''}"></td>
      <td>
        <input type="text" class="airport-cell" list="airportList" placeholder="Código IATA" data-role="destino" oninput="autoAirport(this)" onblur="autoAirport(this,true)" style="text-transform:uppercase;" value="${d.destino||''}">
        <div class="via-wrap${d.via?'':' print-hide-empty'}" style="display:flex; align-items:center; gap:3px; margin-top:2px;">
          <span style="font-size:8.5px; color:var(--muted); font-style:italic;">vía</span>
          <input type="text" class="airport-cell" list="airportList" placeholder="opcional" data-role="via" oninput="autoAirport(this); toggleVia(this);" onblur="autoAirport(this,true); toggleVia(this);" style="text-transform:uppercase; font-style:italic; color:var(--muted);" value="${d.via||''}">
        </div>
      </td>
      <td><input type="time" data-role="salida" onchange="autoNextDay(${id})" value="${d.salida||''}"></td>
      <td><input type="time" data-role="llegada" onchange="autoNextDay(${id})" value="${d.llegada||''}"></td>
      <td style="text-align:center; font-size:11px;" data-role="nextDayDate"></td>
      <td class="col-remove no-print"><button class="btn-remove" onclick="removeRow('itinRow${id}')">×</button></td>
    `;
    document.querySelector('#flightOpt'+optId+' [data-role="itinBody"]').appendChild(tr);
    if(d.fecha) autoNextDay(id);
  }

  function fmtDateDDMMAAAA(iso){
    const parts = iso.split('-');
    if(parts.length !== 3) return '';
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function autoNextDay(id){
    const row = document.getElementById('itinRow'+id);
    const dep = row.querySelector('[data-role="salida"]').value;
    const arr = row.querySelector('[data-role="llegada"]').value;
    const fecha = row.querySelector('[data-role="fecha"]').value;
    const cell = row.querySelector('[data-role="nextDayDate"]');
    if(dep && arr && arr < dep && fecha){
      const d = new Date(fecha + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      const iso = d.toISOString().slice(0,10);
      cell.textContent = fmtDateDDMMAAAA(iso);
    } else {
      cell.textContent = '';
    }
  }

  function removeRow(id){
    const row = document.getElementById(id);
    if(row) row.remove();
  }

  let fareCount = 0;

  function fmt(n){
    n = isNaN(n) ? 0 : n;
    return n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function addFareRow(optId, data){
    fareCount++;
    const id = fareCount;
    const d = data || {};
    const tr = document.createElement('tr');
    tr.id = 'fareRow'+id;
    tr.innerHTML = `
      <td><input type="text" placeholder="Nombre y apellido" data-role="pax" value="${d.pax||''}"></td>
      <td>
        <select data-role="type">
          <option value="ADT" ${(!d.type||d.type==='ADT')?'selected':''}>ADT</option>
          <option value="CHD" ${d.type==='CHD'?'selected':''}>CHD</option>
          <option value="INF" ${d.type==='INF'?'selected':''}>INF</option>
        </select>
      </td>
      <td class="num"><input type="number" min="0" step="0.01" placeholder="0.00" data-role="fare" oninput="render()" value="${d.fare!=null?d.fare:''}"></td>
      <td class="num"><input type="number" min="0" step="0.01" placeholder="0.00" data-role="tax" oninput="render()" value="${d.tax!=null?d.tax:''}"></td>
      <td class="col-total" data-role="rowtotal">0,00</td>
      <td class="col-remove no-print"><button class="btn-remove" onclick="removeFareRow(${id})">×</button></td>
    `;
    document.querySelector('#flightOpt'+optId+' [data-role="faresBody"]').appendChild(tr);
    render();
  }

  function removeFareRow(id){
    const row = document.getElementById('fareRow'+id);
    if(row) row.remove();
    render();
  }

  function render(){
    const cur = document.getElementById('currency').value;
    let grandTotal = 0;
    document.querySelectorAll('.flight-option').forEach(opt=>{
      let sumFares = 0, sumTaxes = 0;
      opt.querySelectorAll('[data-role="faresBody"] tr').forEach(tr=>{
        const fare = parseFloat(tr.querySelector('[data-role="fare"]').value) || 0;
        const tax = parseFloat(tr.querySelector('[data-role="tax"]').value) || 0;
        const total = fare + tax;
        tr.querySelector('[data-role="rowtotal"]').textContent = fmt(total);
        sumFares += fare;
        sumTaxes += tax;
      });
      const optTotal = sumFares + sumTaxes;
      const sumFaresEl = opt.querySelector('[data-role="sumFares"]');
      const sumTaxesEl = opt.querySelector('[data-role="sumTaxes"]');
      const optFareTotalEl = opt.querySelector('[data-role="optFareTotal"]');
      if(sumFaresEl) sumFaresEl.textContent = fmt(sumFares);
      if(sumTaxesEl) sumTaxesEl.textContent = fmt(sumTaxes);
      if(optFareTotalEl) optFareTotalEl.textContent = cur + ' ' + fmt(optTotal);
      grandTotal += optTotal;
    });
    document.getElementById('curSymbol').textContent = cur;
    document.getElementById('grandTotal').innerHTML = `<span id="curSymbol">${cur}</span> ${fmt(grandTotal)}`;
  }

  function resetForm(){
    if(!confirm('¿Vaciar todos los campos y empezar una cotización nueva?')) return;
    document.getElementById('flightOptionsContainer').innerHTML = '';
    fareCount = 0;
    itinCount = 0;
    flightOptCount = 0;
    document.querySelectorAll('.field input, .field select').forEach(el=>{ if(el.tagName==='SELECT'){el.selectedIndex=0;} else {el.value='';} });
    document.getElementById('quoteDate').value = todayLocal();
    autoResizeConditions();
    const newOptId = addFlightOption();
    addItinRow(newOptId);
    addFareRow(newOptId);
    render();
  }

  // init
  document.getElementById('quoteDate').value = todayLocal();
    autoResizeConditions();
  const initOptId = addFlightOption();
  addItinRow(initOptId);
  addItinRow(initOptId);
  addFareRow(initOptId);
  addFareRow(initOptId);
  render();
</script>
